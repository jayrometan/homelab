# clusters/jay1/cilium.yaml
#
# Flux Kustomization for Cilium network configuration.
# Manages the LB-IPAM pool and L2 announcement policy — both are cluster-scoped
# resources that need to exist before any LoadBalancer Service is created.
#
# No dependsOn needed: these CRDs are installed with Cilium itself (which is
# installed as part of k3s bootstrap, not via Flux). They exist before Flux starts.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./infrastructure/cilium
  prune: true
  wait: true
  timeout: 2m
