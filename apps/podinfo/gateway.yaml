apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: homelab-gateway
  namespace: podinfo
spec:
  gatewayClassName: cilium
  listeners:
  - name: http
    port: 8888
    protocol: HTTP
    allowedRoutes:
      namespaces:
        from: Same       # only routes in the podinfo namespace can attach
