# infrastructure/redpanda/cluster/redpanda.yaml
#
# The Redpanda cluster, declared as a single custom resource the operator
# reconciles. spec.clusterSpec mirrors the upstream `redpanda` Helm chart's
# values (Vol 1 §5.1: "the CRD's clusterSpec is essentially the chart's values
# schema").
#
# ── HOMELAB SHAPE (read this before believing anything is production) ────────
#   * 3 brokers, RF=3 → real Raft quorum-of-3, so you can practice EVERY
#     operation in the booklet: maintenance mode, rolling restart, decommission,
#     under-replication recovery, leadership balancing.
#   * 3 physical nodes (jay1 12c/20G, jay2 4c/8G-with-GitLab, jay3 2c/5.5G) with
#     HARD hostname anti-affinity ⇒ exactly one broker per node
#     (redpanda-0→jay1, redpanda-1→jay2, redpanda-2→jay3). Losing any ONE node
#     loses one broker and quorum (2/3) survives — true node-fault-tolerance
#     (Vol 1 §5.1). This is the production posture.
#   * TLS + SASL are OFF for this first milestone (no cert-manager yet). This
#     is an INSECURE lab cluster. Securing it — SASL users, prefixed ACLs,
#     kafka_enable_authorization, per-principal quotas — is lesson 2 (Vol 1 §8,
#     Vol 2 §9). The booklet is emphatic: flip authorization on BEFORE tenants
#     arrive.
#   * local-path storage (node-local). This actually honors Redpanda's
#     local-disk design center (Vol 1 §5.2) — just on the OS disk, not a
#     dedicated NVMe. No cross-node PVC portability: a broker is pinned to its
#     node's data, which is correct for Redpanda (replace-not-move brokers).
#   * Guaranteed QoS (requests==limits) but the kubelet CPU-manager static
#     policy is NOT enabled here, so brokers do NOT get exclusive cpusets. On a
#     latency-critical prod cluster you'd enable it (Vol 1 §2.4). Skipped
#     consciously for the lab.
apiVersion: cluster.redpanda.com/v1alpha2
kind: Redpanda
metadata:
  name: redpanda
  namespace: redpanda
  labels:
    app.kubernetes.io/managed-by: flux
spec:
  clusterSpec:
    # ── Broker set ───────────────────────────────────────────────────────────
    statefulset:
      replicas: 3
      # hard = requiredDuringScheduling: never two brokers on one node. Now that
      # we have 3 nodes (jay1/jay2/jay3), each broker gets its own node, so
      # losing ANY single node loses exactly one broker and quorum (2/3) survives
      # — true node-fault-tolerance (Vol 1 §5.1). This is the production posture.
      # (Was "soft" while we only had 2 nodes, which forced 2 brokers onto jay1.)
      podAntiAffinity:
        type: hard

    # ── Per-broker resources (Vol 2 §12.1 sizing) ────────────────────────────
    # cpu.cores = 1  ⇒  Seastar starts with --smp 1 (one shard per broker).
    # memory.container.max = 2.5Gi ⇒ redpanda --memory is derived from this
    # minus container overhead. 2.5Gi is comfortably above Redpanda's per-shard
    # floor and fits jay2 alongside GitLab.
    resources:
      cpu:
        cores: 1
      memory:
        container:
          max: 2.5Gi

    # ── Storage (Vol 1 §5.2) ─────────────────────────────────────────────────
    storage:
      persistentVolume:
        enabled: true
        storageClass: local-path
        size: 5Gi

    # ── Console (web UI) ─────────────────────────────────────────────────────
    # Deployed as its own Deployment, exposed on a pinned LoadBalancer VIP so
    # you reach it from the MacBook — same pattern as the StackGres console at
    # .241. Cilium L2 announcement (already live) advertises .243 on the LAN.
    console:
      enabled: true
      # Console config overlay (merged over the chart-generated one; our keys
      # win). The chart hardcodes Console's Kafka client to sasl.enabled=true +
      # impersonateUser=true, but this cluster has auth OFF — Console then
      # refuses to boot ("user impersonation ... not allowed when authentication
      # is disabled"). Turn Console's client SASL off so it connects anonymously.
      # This gets removed when we enable SASL in lesson 2.
      config:
        kafka:
          sasl:
            enabled: false
            impersonateUser: false
      service:
        type: LoadBalancer
        annotations:
          # Pin the VIP from the homelab LB-IPAM pool (192.168.1.240/28).
          # .240 podinfo, .241 stackgres-ui, .242 postgres — .243 is free.
          lbipam.cilium.io/ips: "192.168.1.243"

    # ── Listeners / external access (NodePort, shared port) ──────────────────
    # In-cluster clients use the internal listener (headless DNS,
    # redpanda-N.redpanda.redpanda.svc...:9093). EXTERNAL clients (the MacBook)
    # use the NodePort external Kafka listener.
    #
    # Now that it's ONE BROKER PER NODE (hard anti-affinity, 3 nodes), every
    # broker can share a SINGLE nodePort — the node IP already identifies the
    # broker. With externalTrafficPolicy=Local (the chart sets it), a packet to
    # <nodeIP>:31092 can only reach the broker on that node:
    #   redpanda-0 → 192.168.1.25:31092  (jay1)
    #   redpanda-1 → 192.168.1.26:31092  (jay2)
    #   redpanda-2 → 192.168.1.27:31092  (jay3)
    #
    # This lets us drop the whole per-broker workaround we needed when two
    # brokers shared jay1: no per-broker Services (external-nodeports.yaml is
    # gone), and — crucially — NO hardcoded `addresses`. Each broker auto-
    # advertises its own node's HOST_IP (downward-API status.hostIP), so a broker
    # that reschedules to another node advertises the new IP automatically
    # (Vol 1 §6.2). The chart creates a single "redpanda-external" NodePort
    # Service selecting all brokers on port 31092.
    external:
      enabled: true
      type: NodePort
      # (service.enabled defaults true → the chart creates the shared NodePort
      #  Service; no `addresses` → brokers advertise HOST_IP automatically.)
    listeners:
      kafka:
        external:
          default:
            # Pod-side listen port (Service targetPort).
            port: 9094
            # Single value ⇒ one shared nodePort for all brokers. The node IP
            # disambiguates them (one broker per node + externalTrafficPolicy
            # Local). Was a per-broker list [31092,31093,31094] when jay1 held two.
            advertisedPorts:
              - 31092
            # Plaintext to match milestone-1 posture (TLS lands in lesson 2).
            tls:
              enabled: false

    # ── Security: OFF for milestone 1 (see header). Lesson 2 flips these. ─────
    tls:
      enabled: false
    auth:
      sasl:
        enabled: false
