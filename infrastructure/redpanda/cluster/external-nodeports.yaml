# infrastructure/redpanda/cluster/external-nodeports.yaml
#
# One NodePort Service per broker, giving each broker a DISTINCT nodePort so the
# two brokers on jay1 (redpanda-0, redpanda-2) don't collide on a shared port
# (see the WHY block in redpanda.yaml). Each Service:
#   - selects exactly ONE broker pod via statefulset.kubernetes.io/pod-name
#   - externalTrafficPolicy: Local  → the nodePort only resolves to the broker
#     pod running on the node the client dialed; no cross-node hop, source IP
#     preserved. If you dial the wrong node it fails cleanly instead of
#     misrouting to another broker.
#   - nodePort MUST match the advertisedPorts entry for that broker in the CR.
#   - targetPort 9094 = the broker's external Kafka listener port.
#
# Client bootstrap from the MacBook is any of:
#   192.168.1.25:31092, 192.168.1.26:31093, 192.168.1.25:31094
# Metadata then hands back all three advertised addresses; the client connects
# directly to each. (No TLS/SASL yet — plaintext, milestone 1.)
apiVersion: v1
kind: Service
metadata:
  name: redpanda-external-0
  namespace: redpanda
  labels:
    app.kubernetes.io/managed-by: flux
    app.kubernetes.io/part-of: redpanda
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: redpanda
    statefulset.kubernetes.io/pod-name: redpanda-0
  ports:
    - name: kafka-external
      protocol: TCP
      port: 9094
      targetPort: 9094
      nodePort: 31092
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda-external-1
  namespace: redpanda
  labels:
    app.kubernetes.io/managed-by: flux
    app.kubernetes.io/part-of: redpanda
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: redpanda
    statefulset.kubernetes.io/pod-name: redpanda-1
  ports:
    - name: kafka-external
      protocol: TCP
      port: 9094
      targetPort: 9094
      nodePort: 31093
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda-external-2
  namespace: redpanda
  labels:
    app.kubernetes.io/managed-by: flux
    app.kubernetes.io/part-of: redpanda
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: redpanda
    statefulset.kubernetes.io/pod-name: redpanda-2
  ports:
    - name: kafka-external
      protocol: TCP
      port: 9094
      targetPort: 9094
      nodePort: 31094
