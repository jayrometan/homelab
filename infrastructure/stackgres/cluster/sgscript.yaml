# infrastructure/stackgres/cluster/sgscript.yaml
#
# SGScript -- SQL executed by the operator on first cluster boot.
#
# StackGres tracks which scripts have run via a state table and will not re-run
# them on operator restarts or pod rescheduling.
#
# Role design (principle of least privilege):
#   postgres   -- built-in superuser, StackGres-managed, do not use for apps
#   dba        -- superuser for platform/DBA team
#   app_user   -- read/write to app_db; what application pods connect as
#   readonly   -- SELECT on all tables in app_db; BI tools, analysts
#   monitoring -- pg_monitor role; for Prometheus postgres_exporter
#
# Passwords are not set here. scripts/create-pg-superuser.sh handles that
# post-deploy, storing credentials in Kubernetes Secrets.
apiVersion: stackgres.io/v1
kind: SGScript
metadata:
  name: init-database
  namespace: postgres
  labels:
    app.kubernetes.io/managed-by: flux
    app.kubernetes.io/component: database
spec:
  continueOnError: false
  scripts:
    # Script 1: Enable pg_stat_statements on the postgres database.
    # Must be in the postgres database to track queries from all databases.
    - id: 1
      name: enable-extensions
      database: postgres
      user: postgres
      script: |
        CREATE EXTENSION IF NOT EXISTS pg_stat_statements;

    # Script 2: Application database.
    # Plain SELECT does not execute DDL -- use PL/pgSQL DO block with EXECUTE.
    - id: 2
      name: create-app-database
      database: postgres
      user: postgres
      script: |
        DO $$
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_database WHERE datname = 'app_db') THEN
            EXECUTE 'CREATE DATABASE app_db';
          END IF;
        END $$;

    # Script 3: Role hierarchy.
    # No passwords -- create-pg-superuser.sh sets them post-deploy.
    - id: 3
      name: create-roles
      database: postgres
      user: postgres
      script: |
        DO $$
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'dba') THEN
            CREATE ROLE dba SUPERUSER LOGIN;
          END IF;
        END $$;

        DO $$
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'app_user') THEN
            CREATE ROLE app_user LOGIN;
          END IF;
        END $$;

        DO $$
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'readonly') THEN
            CREATE ROLE readonly LOGIN;
          END IF;
        END $$;

        DO $$
        BEGIN
          IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'monitoring') THEN
            CREATE ROLE monitoring LOGIN;
          END IF;
        END $$;
        GRANT pg_monitor TO monitoring;

    # Script 4: App database permissions.
    # Connects to app_db -- requires Script 2 to have succeeded.
    # DEFAULT PRIVILEGES ensure future tables created by migrations are
    # automatically accessible without extra GRANT steps after each migration.
    - id: 4
      name: configure-app-db-permissions
      database: app_db
      user: postgres
      script: |
        GRANT CONNECT ON DATABASE app_db TO app_user, readonly;

        ALTER DEFAULT PRIVILEGES IN SCHEMA public
          GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app_user;

        ALTER DEFAULT PRIVILEGES IN SCHEMA public
          GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO app_user;

        ALTER DEFAULT PRIVILEGES IN SCHEMA public
          GRANT SELECT ON TABLES TO readonly;

        ALTER DEFAULT PRIVILEGES IN SCHEMA public
          GRANT USAGE, SELECT ON SEQUENCES TO readonly;

        CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
